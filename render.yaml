# render.yaml — Render Blueprint
# The Backend serves both the API and the built Frontend static files.

services:
  - type: web
    name: coinBee
    runtime: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
